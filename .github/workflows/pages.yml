# Publishes Termika to GitHub Pages and refreshes the data browsers can't fetch themselves:
# - live stations every run (DHMZ hourly, METAR half-hourly),
# - ALADIN-SI only when ARSO has published a new run (00/06/12/18 UTC, about 3 hours later).
name: Publish site and refresh data

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Keep the last published data in case a source is unreachable
        run: |
          mkdir -p data
          for f in aladin-si.json obs.json; do
            curl -sfL --max-time 60 "https://termika-hr.github.io/data/$f" -o "data/$f" || rm -f "data/$f"
          done
      - name: 'ALADIN-SI for the launch sites (source: ARSO), only when a new run is out'
        continue-on-error: true
        run: python3 tools/aladin_si.py --skip-if-same
      - name: 'Live stations (source: DHMZ; METAR: NOAA)'
        continue-on-error: true
        run: python3 tools/obs.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
