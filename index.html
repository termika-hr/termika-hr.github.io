<!doctype html>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Termika</title>
<meta name="description" content="Prognoza za paragliding u Hrvatskoj: vjetar na startu, baza, vrh termike i rizik grmljavine za svako startno mjesto.">

<script>
  // Apply a saved light/dark choice before the page paints, so it doesn't flash.
  try { var th = JSON.parse(localStorage.getItem('termika:theme')); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch (e) {}
</script>

<link rel="stylesheet" href="css/app.css">
</head>

<div id="app" class="wrap"><p class="boot">Termika…</p></div>
